name: Release PR

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Optional PR title override'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:
    name: Open canary → main release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: canary

      - name: Verify canary is ahead of main
        id: diff
        run: |
          git fetch origin main canary
          AHEAD=$(git rev-list --count origin/main..origin/canary)
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" = "0" ]; then
            echo "canary has no commits ahead of main — nothing to release." >&2
            exit 1
          fi
          echo "canary is $AHEAD commit(s) ahead of main."

      - name: Compute next version (dry-run semantic-release)
        id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(npx -y -p semantic-release -p conventional-changelog-conventionalcommits -p @semantic-release/commit-analyzer semantic-release \
            --dry-run \
            --branches main \
            --plugins @semantic-release/commit-analyzer \
            2>&1 | awk '/The next release version is/ {print $NF}' | tail -n 1 || true)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed next version: ${VERSION:-<none>}"

      - name: Build PR body
        id: body
        run: |
          {
            echo 'body<<EOF'
            echo "## Release PR"
            echo ''
            if [ -n "${{ steps.next.outputs.version }}" ]; then
              echo "Promoting **canary** to **main** for release **v${{ steps.next.outputs.version }}**."
            else
              echo "Promoting **canary** to **main**."
            fi
            echo ''
            echo "- Commits ahead of main: **${{ steps.diff.outputs.ahead }}**"
            echo "- Merging this PR triggers the [Release workflow](../actions/workflows/release.yml) to publish packages to npm."
            echo ''
            echo '### Changes'
            echo ''
            git log origin/main..origin/canary --pretty=format:'- %s (%h)' --no-merges
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TITLE: ${{ github.event.inputs.title }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
          PR_BODY: ${{ steps.body.outputs.body }}
        run: |
          if [ -n "$CUSTOM_TITLE" ]; then
            TITLE="$CUSTOM_TITLE"
          elif [ -n "$NEXT_VERSION" ]; then
            TITLE="chore(release): v${NEXT_VERSION}"
          else
            TITLE="chore(release): promote canary to main"
          fi

          EXISTING=$(gh pr list --base main --head canary --state open --json number --jq '.[0].number' || true)

          if [ -n "$EXISTING" ]; then
            echo "Updating existing PR #$EXISTING"
            gh pr edit "$EXISTING" --title "$TITLE" --body "$PR_BODY"
            gh pr view "$EXISTING" --json url --jq '.url'
          else
            echo "Creating new PR"
            gh pr create \
              --base main \
              --head canary \
              --title "$TITLE" \
              --body "$PR_BODY" \
              --label release
          fi
