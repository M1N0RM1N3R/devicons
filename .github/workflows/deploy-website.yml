name: Deploy Website

on:
  push:
    branches:
      - main
      - canary
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy to
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_PROJECT_NAME: devicons-website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare Pages branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            env="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            env="production"
          else
            env="staging"
          fi

          if [ "$env" = "production" ]; then
            branch="main"
          else
            branch="canary"
          fi

          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Deploying $env via Cloudflare branch $branch"

      - name: Restore cached images
        id: cache-images-restore
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: Images-${{ runner.os }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core icon assets
        run: pnpm build:icons

      - name: Build website
        run: pnpm build:website
        env:
          NODE_ENV: production
          DEPLOY_ENV: ${{ steps.target.outputs.environment }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Run wrangler from apps/website so it picks up both the static
          # output (dist/) and the Pages Functions (functions/og/icons/...)
          # that render OG images on demand at the edge.
          workingDirectory: apps/website
          # Wrangler is pre-installed via pnpm (see apps/website/package.json)
          # so the action skips its own npm-based install which otherwise
          # re-runs every package's postinstall script and breaks the build.
          packageManager: pnpm
          wranglerVersion: '4.83.0'
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ steps.target.outputs.branch }}

      - name: Check if images cache exists for current branch
        id: actions-cache-list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "RESULT=$(gh actions-cache list --branch ${{ github.ref }} --key Images-)" >> $GITHUB_OUTPUT

      - name: Clear existing images cache
        if: ${{ steps.actions-cache-list.outputs.RESULT != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh actions-cache delete ${{ steps.cache-images-restore.outputs.cache-primary-key }} --branch ${{ github.ref }} --confirm

      - name: Cache images
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ${{ steps.cache-images-restore.outputs.cache-primary-key }}

      - name: Summary
        run: |
          {
            echo "### Cloudflare Pages deployment"
            echo ""
            echo "- Environment: \`${{ steps.target.outputs.environment }}\`"
            echo "- Branch: \`${{ steps.target.outputs.branch }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
