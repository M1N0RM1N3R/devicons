name: Deploy Website

on:
  push:
    branches:
      - main
      - canary
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy to
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_PROJECT_NAME: devicons-website
      CLOUDFLARE_PRODUCTION_BRANCH: master
      CLOUDFLARE_STAGING_BRANCH: canary

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deployment target
        id: target
        run: |
          ref="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            env="${{ github.event.inputs.environment }}"
          elif [ "$ref" = "${{ env.CLOUDFLARE_PRODUCTION_BRANCH }}" ]; then
            env="production"
          else
            env="staging"
          fi

          if [ "$env" = "production" ]; then
            branch="${{ env.CLOUDFLARE_PRODUCTION_BRANCH }}"
          else
            branch="${{ env.CLOUDFLARE_STAGING_BRANCH }}"
          fi

          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Deploying to $env via Cloudflare branch $branch"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core icon assets
        run: pnpm build:icons

      - name: Build website
        run: pnpm build:website
        env:
          NODE_ENV: production
          DEPLOY_ENV: ${{ steps.target.outputs.environment }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/website/dist
            --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ steps.target.outputs.branch }}
            --commit-hash=${{ github.sha }}
            --commit-message=${{ github.event.head_commit.message || github.sha }}

      - name: Summary
        run: |
          {
            echo "### Cloudflare Pages deployment"
            echo ""
            echo "- Environment: \`${{ steps.target.outputs.environment }}\`"
            echo "- Branch: \`${{ steps.target.outputs.branch }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
