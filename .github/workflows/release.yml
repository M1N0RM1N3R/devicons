name: Release

on:
  push:
    branches: [main, canary]
    paths:
      - 'packages/core/export-files/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (no publish, no tags)'
        type: boolean
        default: false

permissions:
  contents: write       # commit CHANGELOG, push tags, create releases
  issues: write         # semantic-release issue comments
  pull-requests: write  # semantic-release PR comments
  id-token: write       # npm provenance via OIDC

jobs:
  group1:
    name: Release Group 1 (core/react/vue/svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # registry-url intentionally omitted. setup-node's generated
          # ~/.npmrc pins `_authToken=${NODE_AUTH_TOKEN}` and with no
          # NODE_AUTH_TOKEN that expands to an empty token, which npm
          # treats as explicit auth and short-circuits the Trusted
          # Publisher OIDC handshake — producing a 404 on publish.
      - name: Install npm ≥ 11.5 via corepack (Trusted Publisher OIDC)
        # Bypasses the broken npm 10.9.7 in the Node 22.22.x toolcache
        # (see actions/runner-images#13883) by pulling npm from the
        # registry via corepack rather than self-upgrading the broken one.
        run: |
          corepack enable
          corepack prepare npm@11 --activate
          # Belt-and-suspenders: if a home-dir .npmrc was created by an
          # earlier action, scrub any _authToken line so TP OIDC is used.
          if [ -f "$HOME/.npmrc" ]; then
            sed -i.bak '/_authToken/d' "$HOME/.npmrc" || true
          fi
          npm --version
          echo "--- npm config (sanitised) ---"
          npm config list | sed 's/authToken.*=.*/authToken=<redacted>/'
      - run: pnpm install --frozen-lockfile
      - name: Build core (sprite + font assets + library)
        run: pnpm -F @dev.icons/core build
      - name: Build react/vue/svelte
        run: |
          pnpm -F @dev.icons/react build
          pnpm -F @dev.icons/vue build
          pnpm -F @dev.icons/svelte build
      - name: Release Group 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/release-group1.mjs

  font:
    name: Release devicons (font)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # registry-url intentionally omitted. setup-node's generated
          # ~/.npmrc pins `_authToken=${NODE_AUTH_TOKEN}` and with no
          # NODE_AUTH_TOKEN that expands to an empty token, which npm
          # treats as explicit auth and short-circuits the Trusted
          # Publisher OIDC handshake — producing a 404 on publish.
      - name: Install npm ≥ 11.5 via corepack (Trusted Publisher OIDC)
        # Bypasses the broken npm 10.9.7 in the Node 22.22.x toolcache
        # (see actions/runner-images#13883) by pulling npm from the
        # registry via corepack rather than self-upgrading the broken one.
        run: |
          corepack enable
          corepack prepare npm@11 --activate
          # Belt-and-suspenders: if a home-dir .npmrc was created by an
          # earlier action, scrub any _authToken line so TP OIDC is used.
          if [ -f "$HOME/.npmrc" ]; then
            sed -i.bak '/_authToken/d' "$HOME/.npmrc" || true
          fi
          npm --version
          echo "--- npm config (sanitised) ---"
          npm config list | sed 's/authToken.*=.*/authToken=<redacted>/'
      - run: pnpm install --frozen-lockfile
      - name: Build core (produces font assets in packages/core/dist/font)
        run: pnpm -F @dev.icons/core build
      - name: Build devicons font package
        run: pnpm -F devicons build
      - name: Release devicons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          pnpm exec semantic-release -e ./packages/font/release.config.cjs $ARGS

  sync-canary:
    name: Sync main → canary
    needs: [group1, font]
    runs-on: ubuntu-latest
    # Only after a real release on main. Skip on canary pushes, dry-runs,
    # and any workflow_dispatch (manual runs are for testing).
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: canary
          persist-credentials: true
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge main into canary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          CANARY_SHA=$(git rev-parse HEAD)

          if [ "$MAIN_SHA" = "$CANARY_SHA" ]; then
            echo "canary is already at main ($MAIN_SHA) — nothing to sync."
            exit 0
          fi

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "canary already contains main — nothing to sync."
            exit 0
          fi

          if git merge --ff-only origin/main; then
            echo "Fast-forwarded canary to main."
            git push origin canary
            exit 0
          fi

          echo "Fast-forward not possible — creating a merge commit."
          if git merge origin/main --no-edit \
              -m "chore(sync): merge main into canary [skip ci]"; then
            git push origin canary
            echo "canary synced with main via merge commit."
            exit 0
          fi

          echo "Merge conflict — aborting and opening a sync PR for manual resolution."
          git merge --abort || true

          SYNC_BRANCH="chore/sync-main-into-canary-${GITHUB_RUN_ID}"
          git checkout -b "$SYNC_BRANCH" origin/canary
          if git merge origin/main --no-edit \
              -m "chore(sync): merge main into canary [skip ci]"; then
            git push origin "$SYNC_BRANCH"
          else
            git add -A
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore(sync): merge main into canary (CONFLICTS — resolve before merging) [skip ci]" || true
            git push origin "$SYNC_BRANCH"
          fi

          gh pr create \
            --base canary \
            --head "$SYNC_BRANCH" \
            --title "chore(sync): merge main into canary" \
            --body "Automated sync after main release failed to merge cleanly. Resolve conflicts and merge this PR to bring canary up to date with main." \
            --label sync || true

          echo "::error::main → canary merge had conflicts. Sync PR opened on branch $SYNC_BRANCH."
          exit 1
